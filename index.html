<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تراز، رتبه و دانشگاه‌ها</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .box {
    background: #fff;
    border-radius: 20px;
    padding: 30px;
    max-width: 540px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    position: relative;
  }
  h1 {
    text-align: center;
    color: #1e3c72;
    font-size: 20px;
    margin-bottom: 5px;
  }
  .sub {
    text-align: center;
    color: #888;
    font-size: 12px;
    margin-bottom: 20px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 12px 0;
  }
  .row label { flex: 1; font-size: 14px; color: #333; }
  .row .coef {
    font-size: 11px; color: #e67e22; background: #fef5e7;
    padding: 2px 8px; border-radius: 20px;
  }
  .row input {
    width: 100px; padding: 10px; border: 2px solid #e0e0e0;
    border-radius: 10px; text-align: center; font-size: 15px; outline: none;
  }
  .row input:focus { border-color: #2a5298; }
  button {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff; border: none; border-radius: 12px;
    font-size: 16px; font-family: Tahoma; cursor: pointer;
    margin-top: 20px;
  }
  
  .switch-btn {
    background: #f0f4f8;
    color: #1e3c72;
    border: 2px solid #1e3c72;
    margin-top: 15px;
    padding: 10px;
    font-size: 14px;
  }
  .switch-btn:hover { background: #e8eef7; }

  #directForm { display: none; }
  .radio-group {
    display: flex; justify-content: center; gap: 20px;
    margin-bottom: 15px; font-size: 14px;
  }
  .radio-group label { cursor: pointer; }
  .radio-group input[type="radio"] { margin-left: 5px; }
  .direct-row { justify-content: center; margin-top: 20px; }
  .direct-row label { flex: none; margin-left: 10px; }

  .result {
    margin-top: 20px; padding: 20px;
    background: linear-gradient(135deg, #e8f6ef, #d4efdf);
    border-radius: 15px; display: none;
  }
  .result .item { margin: 8px 0; font-size: 15px; text-align: center; }
  .result .big { font-size: 32px; font-weight: bold; color: #1e8449; }
  .result .rank { font-size: 24px; font-weight: bold; color: #c0392b; }
  
  .unis {
    margin-top: 15px; padding-top: 15px;
    border-top: 1px dashed #aaa;
  }
  .unis h3 {
    font-size: 15px; color: #1e3c72; margin-bottom: 10px;
    text-align: center;
  }
  .uni-item {
    display: flex; justify-content: space-between;
    padding: 8px 12px; margin: 6px 0;
    border-radius: 10px; font-size: 14px;
  }
  .uni-yes { background: #d4efdf; color: #1e8449; }
  .uni-maybe { background: #fef9e7; color: #b7950b; }
  .uni-item .name { font-weight: bold; }
  .uni-item .last { font-size: 12px; opacity: .8; }

  .channel {
    text-align: center; margin-top: 20px; padding-top: 15px;
    border-top: 1px dashed #ddd; font-size: 13px;
  }
  .channel a { color: #2a5298; text-decoration: none; font-weight: bold; }
</style>
</head>
<body>
<div class="box">
  <h1>🧮 تراز، رتبه و دانشگاه‌ها</h1>
  <div class="sub">منطقه ۱ تجربی - آخرین رتبه‌های ۴۰۴</div>

  <div id="percentForm">
    <div class="row"><label>زیست‌شناسی</label><span class="coef">۱۲</span><input id="d1" type="number" placeholder="%"></div>
    <div class="row"><label>فیزیک</label><span class="coef">۷</span><input id="d2" type="number" placeholder="%"></div>
    <div class="row"><label>شیمی</label><span class="coef">۹</span><input id="d3" type="number" placeholder="%"></div>
    <div class="row"><label>ریاضی</label><span class="coef">۷</span><input id="d4" type="number" placeholder="%"></div>
    <button onclick="calcPercent()">محاسبه تراز و رتبه</button>
    <button class="switch-btn" onclick="switchMode('direct')">رتبه یا تراز کل دارم، مستقیم وارد می‌کنم</button>
  </div>

  <div id="directForm">
    <div class="radio-group">
      <label><input type="radio" name="directType" value="rank" checked> رتبه</label>
      <label><input type="radio" name="directType" value="taraz"> تراز کل</label>
    </div>
    <div class="row direct-row">
      <label>مقدار:</label>
      <input id="directValue" type="number" placeholder="وارد کنید" style="width:150px;">
    </div>
    <button onclick="calcDirect()">مشاهده دانشگاه‌ها</button>
    <button class="switch-btn" onclick="switchMode('percent')">بازگشت به درصدها</button>
  </div>

  <div class="result" id="res">
    <div class="item">تراز تخمینی/واقعی: <span class="big" id="outTaraz">0</span></div>
    <div class="item">رتبه منطقه ۱: <span class="rank" id="outRank">-</span></div>

    <div class="unis">
      <h3>✅ دانشگاه‌هایی که شانس قبولی داری</h3>
      <div id="uniYes"></div>
      
      <h3 style="margin-top:15px;">⚠️ نزدیک به رتبه‌ات (شانس کم)</h3>
      <div id="uniMaybe"></div>
    </div>
  </div>

  <div class="channel">📢 <a href="https://t.me/Hokm_Akhar" target="_blank">@Hokm_Akhar حکم آخر</a></div>
</div>

<!-- 👇 قفل امنیتی دامنه 👇 -->
<script>
  if (window.location.hostname !== 'anonymous8430.github.io') {
    document.body.innerHTML = "<div style='text-align:center; padding:50px; font-family:Tahoma; background:#fff; height:100vh;'><h1>⚠️ دسترسی غیرمجاز</h1><p>این برنامه فقط از طریق ربات تلگرام حکم یاب قابل استفاده است.</p><a href='https://t.me/HokmYabBot' style='color:blue;'>ورود به ربات تلگرام</a></div>";
    throw new Error("Unauthorized domain");
  }
</script>

<!-- 👇 کدهای اصلی برنامه 👇 -->
<script>
// دیتابیس دانشگاه‌ها (منطقه ۱ - ۴۰۴)
var medicalUnis = [
    {name: 'پزشکی تهران', last: 51},
    {name: 'پزشکی شهید بهشتی', last: 200},
    {name: 'پزشکی مشهد', last: 248},
    {name: 'پزشکی شیراز', last: 281},
    {name: 'پزشکی ایران', last: 358},
    {name: 'پزشکی تبریز', last: 491},
    {name: 'پزشکی اصفهان', last: 582},
    {name: 'پزشکی بابل', last: 732},
    {name: 'پزشکی کرمانشاه', last: 918},
    {name: 'پزشکی اهواز', last: 1121},
    {name: 'پزشکی زنجان', last: 1560},
    {name: 'پزشکی ارومیه', last: 1821},
    {name: 'پزشکی اراک', last: 2411},
    {name: 'پزشکی قزوین', last: 2854},
    {name: 'پزشکی سمنان', last: 3420},
    {name: 'پزشکی شهرکرد', last: 3845}
];

var dentalUnis = [
    {name: 'دندان‌پزشکی تهران', last: 66},
    {name: 'دندان‌پزشکی شهید بهشتی', last: 95},
    {name: 'دندان‌پزشکی مشهد', last: 171},
    {name: 'دندان‌پزشکی شیراز', last: 232},
    {name: 'دندان‌پزشکی اصفهان', last: 321},
    {name: 'دندان‌پزشکی تبریز', last: 409},
    {name: 'دندان‌پزشکی بابل', last: 625},
    {name: 'دندان‌پزشکی کرمان', last: 812},
    {name: 'دندان‌پزشکی اهواز', last: 1105},
    {name: 'دندان‌پزشکی یزد', last: 1543}
];

function switchMode(mode) {
  document.getElementById('res').style.display = 'none';
  if(mode === 'direct') {
    document.getElementById('percentForm').style.display = 'none';
    document.getElementById('directForm').style.display = 'block';
  } else {
    document.getElementById('percentForm').style.display = 'block';
    document.getElementById('directForm').style.display = 'none';
  }
}

function calcPercent(){
  // وزن‌های تنظیم‌شده دقیق بر اساس ضرایب جدید (ریاضی ۷)
  var w = [2.6, 1.5, 1.9, 1.5]; 
  var sumW = 0;
  for(var j=0;j<4;j++) sumW += w[j];
  var avgs = [50, 55, 45, 40]; // میانگین‌های تنظیم‌شده
  var baseTaraz = 9650;
  var K = 95;

  var wp = 0, wa = 0;
  for(var i=0;i<4;i++){
    var v = parseFloat(document.getElementById('d'+(i+1)).value);
    var p = isNaN(v) ? 0 : Math.max(0, Math.min(100, v));
    wp += p * w[i];
    wa += avgs[i] * w[i];
  }
  wp /= sumW; wa /= sumW;
  var taraz = baseTaraz + (wp - wa) * K;

  var rank = tarazToRank(taraz);
  showResult(taraz, rank);
}

function calcDirect(){
  var type = document.querySelector('input[name="directType"]:checked').value;
  var val = parseFloat(document.getElementById('directValue').value);
  
  if(isNaN(val)) {
    alert('لطفا یک عدد معتبر وارد کنید.');
    return;
  }

  var taraz, rank;
  if(type === 'taraz') {
    taraz = val;
    rank = tarazToRank(taraz);
  } else {
    rank = val;
    var table = [
      [11511, 10], [10800, 112], [10200, 500], [10050, 716],
      [9900, 1000], [9650, 1500], [9500, 2000], [9350, 2500]
    ];
    if(rank <= table[0][1]) taraz = table[0][0];
    else if(rank >= table[table.length-1][1]) taraz = table[table.length-1][0];
    else {
      for(var i=0;i<table.length-1;i++){
        var hi = table[i], lo = table[i+1];
        if(rank >= hi[1] && rank <= lo[1]){
          var ratio = (rank - hi[1]) / (lo[1] - hi[1]);
          taraz = hi[0] + ratio * (lo[0] - hi[0]);
          break;
        }
      }
    }
  }
  showResult(taraz, rank);
}

function tarazToRank(taraz) {
  var table = [
    [11511, 10], [10800, 112], [10200, 500], [10050, 716],
    [9900, 1000], [9650, 1500], [9500, 2000], [9350, 2500]
  ];
  if(taraz >= table[0][0]) return table[0][1];
  if(taraz <= table[table.length-1][0]) return table[table.length-1][1];
  for(var k=0;k<table.length-1;k++){
    var hi = table[k], lo = table[k+1];
    if(taraz <= hi[0] && taraz >= lo[0]){
      var ratio = (hi[0]-taraz)/(hi[0]-lo[0]);
      return Math.round(hi[1] + ratio*(lo[1]-hi[1]));
    }
  }
  return null;
}

function showResult(taraz, rank) {
  document.getElementById('outTaraz').innerText = Math.round(taraz).toLocaleString('fa-IR');
  document.getElementById('outRank').innerText = rank ? rank.toLocaleString('fa-IR') : '-';

  var yesList = [], maybeList = [];

  function filterUnis(arr, type) {
    for(var u=0; u<arr.length; u++){
      var diff = arr[u].last - rank;
      var item = {name: type + ' ' + arr[u].name, last: arr[u].last};
      
      if(diff >= 50) {
        yesList.push(item);
      } else if(diff >= -100 && diff < 50) {
        maybeList.push(item);
      }
    }
  }

  filterUnis(medicalUnis, '🩺');
  filterUnis(dentalUnis, '🦷');

  var yesDiv = document.getElementById('uniYes');
  yesDiv.innerHTML = '';
  if(yesList.length === 0){
    yesDiv.innerHTML = '<div style="text-align:center;color:#888;font-size:13px;">هیچ دانشگاهی در محدوده مطمئن نیست.</div>';
  } else {
    for(var i=0; i<yesList.length; i++){
      var d = document.createElement('div');
      d.className = 'uni-item uni-yes';
      d.innerHTML = '<span class="name">✅ ' + yesList[i].name + '</span>' +
                    '<span class="last">آخرین: ' + yesList[i].last.toLocaleString('fa-IR') + '</span>';
      yesDiv.appendChild(d);
    }
  }

  var maybeDiv = document.getElementById('uniMaybe');
  maybeDiv.innerHTML = '';
  if(maybeList.length === 0){
    maybeDiv.innerHTML = '<div style="text-align:center;color:#888;font-size:13px;">دانشگاه نزدیکی پیدا نشد.</div>';
  } else {
    for(var j=0; j<maybeList.length; j++){
      var d2 = document.createElement('div');
      d2.className = 'uni-item uni-maybe';
      d2.innerHTML = '<span class="name">⚠️ ' + maybeList[j].name + '</span>' +
                     '<span class="last">آخرین: ' + maybeList[j].last.toLocaleString('fa-IR') + '</span>';
      maybeDiv.appendChild(d2);
    }
  }

  document.getElementById('res').style.display = 'block';
}
</script>
</body>
</html>
