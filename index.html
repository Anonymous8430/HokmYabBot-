function clearResults() {
  document.getElementById('res').style.display = 'none';
}

function switchMode(mode) {
  clearResults();
  if(mode === 'direct') {
    document.getElementById('percentForm').style.display = 'none';
    document.getElementById('directForm').style.display = 'block';
  } else {
    document.getElementById('percentForm').style.display = 'block';
    document.getElementById('directForm').style.display = 'none';
  }
}

function calcPercent(){
  var region = document.getElementById('regionSelect').value;
  var w = [2.6, 1.5, 1.9, 1.5]; 
  var sumW = 0;
  for(var j=0;j<4;j++) sumW += w[j];
  var avgs = [50, 55, 45, 40];
  var baseTaraz = 9650;
  var K = 95;

  var wp = 0, wa = 0;
  for(var i=0;i<4;i++){
    var v = parseFloat(document.getElementById('d'+(i+1)).value);
    var p = isNaN(v) ? 0 : Math.max(0, Math.min(100, v));
    wp += p * w[i];
    wa += avgs[i] * w[i];
  }
  wp /= sumW; wa /= sumW;
  var taraz = baseTaraz + (wp - wa) * K;
  var rank = getRankFromTaraz(taraz, region);
  showResult(taraz, rank, region);
}

function calcDirect(){
  var region = document.getElementById('regionSelect').value;
  var type = document.querySelector('input[name="directType"]:checked').value;
  var val = parseFloat(document.getElementById('directValue').value);
  
  if(isNaN(val)) {
    alert('لطفا یک عدد معتبر وارد کنید.');
    return;
  }

  var taraz, rank;
  if(type === 'taraz') {
    taraz = val;
    rank = getRankFromTaraz(taraz, region);
  } else {
    rank = val;
    taraz = getTarazFromRank(rank, region);
  }
  showResult(taraz, rank, region);
}

function getRankFromTaraz(taraz, region) {
  var table = tarazRankTable[region];
  if(taraz >= table[0][0]) return table[0][1];
  if(taraz <= table[table.length-1][0]) return table[table.length-1][1];
  for(var k=0;k<table.length-1;k++){
    var hi = table[k], lo = table[k+1];
    if(taraz <= hi[0] && taraz >= lo[0]){
      var ratio = (hi[0]-taraz)/(hi[0]-lo[0]);
      return Math.round(hi[1] + ratio*(lo[1]-hi[1]));
    }
  }
  return null;
}

function getTarazFromRank(rank, region) {
  var table = tarazRankTable[region];
  if(rank <= table[0][1]) return table[0][0];
  if(rank >= table[table.length-1][1]) return table[table.length-1][0];
  for(var i=0;i<table.length-1;i++){
    var hi = table[i], lo = table[i+1];
    if(rank >= hi[1] && rank <= lo[1]){
      var ratio = (rank - hi[1]) / (lo[1] - hi[1]);
      return Math.round(hi[0] + ratio * (lo[0] - hi[0]));
    }
  }
  return null;
}

function showResult(taraz, rank, region) {
  document.getElementById('outTaraz').innerText = Math.round(taraz).toLocaleString('fa-IR');
  document.getElementById('outRank').innerText = rank ? rank.toLocaleString('fa-IR') : '-';

  var major = document.getElementById('majorSelect').value;
  var data = unisData[region][major];
  
  var yesList = [], maybeList = [];

  for(var u=0; u<data.length; u++){
    var diff = data[u].last - rank;
    var item = data[u];
    
    var yesThreshold = (region === "3" || major !== 'medicine') ? 80 : 50;
    var maybeThreshold = (region === "3" || major !== 'medicine') ? -120 : -100;

    if(diff >= yesThreshold) {
      yesList.push(item);
    } else if(diff >= maybeThreshold && diff < yesThreshold) {
      maybeList.push(item);
    }
  }

  var resDiv = document.getElementById('uniResults');
  resDiv.innerHTML = '';

  var majorNames = {
    medicine: 'پزشکی', dental: 'دندان‌پزشکی', pharmacy: 'داروسازی', physio: 'فیزیوتراپی', optometry: 'بینایی‌سنجی'
  };

  var yesHtml = '<h3>✅ ' + majorNames[major] + ' - شانس بالا</h3>';
  if(yesList.length === 0){
    yesHtml += '<div style="text-align:center;color:#aaa;font-size:12px;margin-bottom:10px;">دانشگاهی پیدا نشد.</div>';
  } else {
    for(var i=0; i<yesList.length; i++){
      yesHtml += '<div class="uni-item uni-yes">' +
                 '<span class="name">' + yesList[i].name + ' <span class="uni-type">' + yesList[i].type + '</span></span>' +
                 '<span class="last">آخرین: ' + yesList[i].last.toLocaleString('fa-IR') + '</span></div>';
    }
  }
  
  var maybeHtml = '<h3 style="margin-top:15px;">⚠️ ' + majorNames[major] + ' - شانس کم / مرز</h3>';
  if(maybeList.length === 0){
    maybeHtml += '<div style="text-align:center;color:#aaa;font-size:12px;">دانشگاهی پیدا نشد.</div>';
  } else {
    for(var j=0; j<maybeList.length; j++){
      maybeHtml += '<div class="uni-item uni-maybe">' +
                   '<span class="name">' + maybeList[j].name + ' <span class="uni-type">' + maybeList[j].type + '</span></span>' +
                   '<span class="last">آخرین: ' + maybeList[j].last.toLocaleString('fa-IR') + '</span></div>';
    }
  }

  resDiv.innerHTML = yesHtml + maybeHtml;
  document.getElementById('res').style.display = 'block';
}
</script>
