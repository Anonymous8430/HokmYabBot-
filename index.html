function searchUniversities() {
  var query = document.getElementById('searchInput').value.trim().toLowerCase();
  var region = document.getElementById('regionSelect').value;
  var searchContainer = document.getElementById('searchResultsContainer');
  var calcContainer = document.getElementById('calcResultsContainer');
  var resBox = document.getElementById('res');

  if(query === "") { searchContainer.innerHTML = ''; calcContainer.style.display = 'block'; resBox.style.display = 'none'; return; }
  calcContainer.style.display = 'none'; searchContainer.innerHTML = ''; resBox.style.display = 'block';

  var found = false;
  var majorsList = ['medicine', 'dental', 'pharmacy', 'nursing', 'midwifery', 'surgery', 'anesthesia', 'lab', 'physio', 'optometry'];

  majorsList.forEach(function(major) {
    var data = unisData[region][major];
    var matches = data.filter(function(uni) { return uni.name.toLowerCase().includes(query); });
    if(matches.length > 0) {
      found = true;
      searchContainer.innerHTML += '<div class="major-separator">' + majorNames[major] + '</div><div class="unis">';
      matches.forEach(function(uni) {
        searchContainer.innerHTML += '<div class="uni-item uni-yes"><span class="name">' + uni.name + ' <span class="uni-type">' + uni.type + '</span></span><span class="last">آخرین: ' + uni.last.toLocaleString('fa-IR') + '</span></div>';
      });
      searchContainer.innerHTML += '</div>';
    }
  });
  if(!found) searchContainer.innerHTML = '<div style="text-align:center;color:#aaa;font-size:14px;padding:20px;">دانشگاهی با این نام پیدا نشد.</div>';
}

// 🔴 تابع محاسبه تراز از درصد (آپدیت شده با ۱۵ داده جدید)
function calcPercent(){
  var region = document.getElementById('regionSelect').value;
  
  // ضرایب و میانگین‌های بهینه‌شده با داده‌های جدید
  var w = [2.8, 1.8, 2.1, 1.7]; 
  var sumW = 0;
  for(var j=0;j<4;j++) sumW += w[j];
  var avgs = [48, 48, 40, 32]; 
  var baseTaraz = 9800; 
  var K = 90;

  var wp = 0, wa = 0;
  for(var i=0;i<4;i++){
    var v = parseFloat(document.getElementById('d'+(i+1)).value);
    var p = isNaN(v) ? 0 : Math.max(0, Math.min(100, v));
    wp += p * w[i]; wa += avgs[i] * w[i];
  }
  wp /= sumW; wa /= sumW;
  var taraz = baseTaraz + (wp - wa) * K;
  
  var rank = getRankFromTaraz(taraz, region);
  showResult(taraz, rank, region);
}

function calcDirect(){
  var region = document.getElementById('regionSelect').value;
  var type = document.querySelector('input[name="directType"]:checked').value;
  var val = parseFloat(document.getElementById('directValue').value);
  if(isNaN(val)) { alert('لطفا یک عدد معتبر وارد کنید.'); return; }
  var taraz, rank;
  if(type === 'taraz') { taraz = val; rank = getRankFromTaraz(taraz, region); } 
  else { rank = val; taraz = getTarazFromRank(rank, region); }
  showResult(taraz, rank, region);
}

function getRankFromTaraz(taraz, region) {
  var table = tarazRankTable[region];
  if(taraz > table[0][0]) { var ratioTop = (taraz - table[0][0]) / (table[0][0] - table[1][0]); var estimatedRank = table[0][1] - (ratioTop * (table[1][1] - table[0][1])); return Math.max(1, Math.round(estimatedRank)); }
  if(taraz < table[table.length-1][0]) { var ratioBot = (table[table.length-2][0] - taraz) / (table[table.length-2][0] - table[table.length-1][0]); var estimatedRankBot = table[table.length-2][1] + (ratioBot * (table[table.length-1][1] - table[table.length-2][1])); return Math.round(estimatedRankBot); }
  for(var k=0;k<table.length-1;k++){ var hi = table[k], lo = table[k+1]; if(taraz <= hi[0] && taraz >= lo[0]){ var ratio = (hi[0]-taraz)/(hi[0]-lo[0]); return Math.round(hi[1] + ratio*(lo[1]-hi[1])); } }
  return null;
}

function getTarazFromRank(rank, region) {
  var table = tarazRankTable[region];
  if(rank < table[0][1]) { var ratioTop = (table[0][1] - rank) / (table[1][1] - table[0][1]); return Math.round(table[0][0] + ratioTop * (table[0][0] - table[1][0])); }
  if(rank > table[table.length-1][1]) { var ratioBot = (rank - table[table.length-2][1]) / (table[table.length-1][1] - table[table.length-2][1]); return Math.round(table[table.length-2][0] - ratioBot * (table[table.length-2][0] - table[table.length-1][0])); }
  for(var i=0;i<table.length-1;i++){ var hi = table[i], lo = table[i+1]; if(rank >= hi[1] && rank <= lo[1]){ var ratio = (rank - hi[1]) / (lo[1] - hi[1]); return Math.round(hi[0] + ratio * (lo[0] - hi[0])); } }
  return null;
}

    var maybeHtml = '<h3 style="margin-top:15px;">⚠️ ' + majorNames[major] + ' - شانس کم / مرز</h3>';
    if(maybeList.length === 0){ maybeHtml += '<div style="text-align:center;color:#aaa;font-size:12px;">دانشگاهی پیدا نشد.</div>'; } 
    else { for(var j=0; j<maybeList.length; j++){ maybeHtml += '<div class="uni-item uni-maybe"><span class="name">' + maybeList[j].name + ' <span class="uni-type">' + maybeList[j].type + '</span></span><span class="last">آخرین: ' + maybeList[j].last.toLocaleString('fa-IR') + '</span></div>'; } }
    resDiv.innerHTML = yesHtml + maybeHtml;
  }
  document.getElementById('res').style.display = 'block';
}
</script>
</body>
